name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Test
        # Every suite runs as a plain node script, so this needs nothing installed
        # beyond the dependencies above.
        run: npm test

      - name: Build app
        # The accounts API is served by the Worker on the custom domain, so the
        # Pages build points at it rather than keeping a second, browser-local
        # set of accounts on *.pages.dev. Baked in at build time — change it here,
        # not in the dashboard.
        env:
          VITE_API_URL: https://mapmycams.dev
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mapmycams
